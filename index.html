<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>THANH HAI – Character Studio V3</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--line:#1f2d4a;--mut:#8da0c4;--tx:#e8eefc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html,body{margin:0;min-height:100%}
body{background:radial-gradient(1100px 620px at 50% -8%,#15346a 0%,#0a1328 46%,#060910 100%) fixed;color:var(--tx);font:15px/1.4 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:12px 14px 56px}
header{display:flex;align-items:center;gap:12px;padding:10px 2px 18px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:12px;border:1px solid #3a63b0;background:linear-gradient(145deg,#16305e,#0b1630);box-shadow:0 0 18px #2563eb55;display:grid;place-items:center;font-weight:300;font-size:22px;letter-spacing:-1px}
.brand{font-size:20px;font-weight:700}.brand span{font-weight:400;color:#c9d6f3}
.sub{padding-left:12px;border-left:1px solid var(--line);color:var(--mut);font-size:14px}
.ver{margin-left:auto;border:1px solid #2c3d63;border-radius:12px;padding:7px 14px;color:#b9c8e8;letter-spacing:2px;font-size:14px}
#main{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#0f182b;border-radius:13px;padding:0 14px;height:42px;cursor:pointer;transition:.2s;color:#c4d2f0;text-decoration:none}
.btn:hover:not(:disabled){border-color:#4a74d0;background:#13213d}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tile:focus-visible,.gb:focus-visible,.tab:focus-visible{outline:2px solid #7cc4ff;outline-offset:2px}
.hint{text-align:center;color:var(--mut);margin:0 0 18px}
.home{display:grid;gap:16px;grid-template-columns:1fr}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:26px 22px;border-radius:28px;border:1px solid #2b4d8c;background:radial-gradient(400px 200px at 80% 0,#1d4a9a55,transparent 70%),linear-gradient(#10244a,#080f1f);cursor:pointer;transition:.25s;box-shadow:0 0 30px #1d4ed82e}
.tile:hover{border-color:#6bb4ff;box-shadow:0 0 40px #2f7bff77;transform:translateY(-2px)}
.tile svg{width:44px;height:44px;stroke:#7cb4ff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.tile b{font-size:22px;letter-spacing:1px}.tile span{color:var(--mut);font-size:14px}.tile em{font-style:normal;color:#7cb4ff;font-size:13px;margin-top:6px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top h2{margin:0;font-size:22px}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.cc{border:1px solid #274577;border-radius:24px;padding:10px;background:linear-gradient(#10244a,#080f1f);transition:.25s;text-align:center}
.cc.sel{border-color:#5fb0ff;box-shadow:0 0 0 1px #5fb0ff,0 0 34px #2f7bff88}
.cc .im{height:230px;border-radius:16px;background:radial-gradient(circle at 50% 70%,#1d4a8a88,#0a1224);display:grid;place-items:center;overflow:hidden}
.cc img{max-width:100%;max-height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 16px #3b82f677)}
.cc h3{margin:10px 0 2px;font-size:16px;letter-spacing:.5px}.cc small{color:var(--mut);display:block;margin-bottom:10px;font-size:13px}
.cc .btn{width:100%;border-color:#3a63b0;background:linear-gradient(#1c4a9e,#143676);color:#fff;font-weight:600}.cc.sel .btn{background:linear-gradient(#25a37a,#16795a);border-color:#34d399}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 8px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:#0d1526;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px;white-space:nowrap;transition:.2s}
.tab b{margin-left:6px;color:#7cb4ff}.tab.on{border-color:#5fb0ff;background:#14284d;box-shadow:0 0 14px #2f7bff55}
.list{display:grid;gap:12px;margin-top:6px}@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
.mi{border:1px solid #1a2845;border-radius:20px;padding:12px;background:#0b1325;box-shadow:0 0 20px #1d4ed814}
.mi .n{font-weight:600;font-size:16px}.mi .p{color:var(--mut);font-size:12px;margin:3px 0 8px}
.mt{width:100%;max-height:300px;object-fit:cover;object-position:center top;border-radius:14px;margin-bottom:10px;display:block;background:#0a1224;cursor:zoom-in}
.gal{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch}.gal img{height:150px;border-radius:12px;flex:none;background:#0a1224;cursor:zoom-in}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{border:1px solid #243558;border-radius:8px;padding:2px 8px;font-size:12px;color:#b6c5e6}
.c-alok{border-color:#2f7bff;color:#8cc0ff}.c-ignis{border-color:#ef4b4b;color:#ff9b9b}.c-kapella{border-color:#e879b9;color:#f9a8d4}
.dlb{background:linear-gradient(#1c4a9e,#143676);border-color:#3a63b0;color:#fff;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}.nt{color:#c9b27a;font-size:12.5px;margin:0 0 8px}.empty{text-align:center;color:var(--mut);padding:26px 8px}
.gl{display:grid;gap:10px}.gb{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid #274577;border-radius:18px;padding:16px;background:linear-gradient(#10244a,#080f1f);cursor:pointer;transition:.25s}
.gb:hover{border-color:#6bb4ff}.gb.sel{border-color:#5fb0ff;box-shadow:0 0 0 1px #5fb0ff,0 0 28px #2f7bff77}.gb b{font-size:16px}.gb small{color:var(--mut)}
.foot{margin-top:22px;color:#c9b27a;font-size:12.5px}
#lb{position:fixed;inset:0;z-index:70;background:#000d;display:none;place-items:center;padding:16px;cursor:zoom-out}#lb.on{display:grid}#lb img{max-width:100%;max-height:100%;border-radius:12px}
@media(min-width:760px){.home{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

 let h='';
 if(S.v==='home'){
  h=`<p class="hint">Chọn loại mod bạn muốn xem</p><div class="home"><button class="tile" data-a="go" data-v="char">${IC.char}<b>MOD NHÂN VẬT</b><span>ALOK · IGNIS · KAPELLA</span><em>${cg.length} mod</em></button><button class="tile" data-a="go" data-v="gun">${IC.gun}<b>MOD SÚNG</b><span>Súng LV7 · M1887 · MP40</span><em>${gg.length} mod</em></button></div>`;
 }else if(S.v==='char'){
  h=`<div class="top"><button class="btn" data-a="go" data-v="home">← Quay lại</button><h2>Mod nhân vật</h2></div><p class="hint" style="text-align:left">Chọn nhân vật để xem mod và ảnh đi kèm</p><div class="chars">${['alok','ignis','kapella'].map(c=>`<div class="cc ${S.c===c?'sel':''}"><div class="im"><img src="${CARD[c]}" alt="${CN[c]}"></div><h3>${CN[c]}</h3><small>${cg.filter(g=>g.c===c).length} mod</small><button class="btn" data-a="pc" data-c="${c}">${S.c===c?'Đã chọn ✓':'Chọn nhân vật'}</button></div>`).join('')}</div>`;
  if(S.c){
   const mine=cg.filter(g=>g.c===S.c),list=mine.filter(g=>!S.ver||g.vs.some(m=>m.v===S.ver)),ex=!S.ver?EXTRA.filter(e=>e.c===S.c):[];
   h+=`<div class="tabs">${[['','Tất cả'],['FFTH','FF thường (FFTH)'],['FFM','FF MAX (FFM)']].map(([v,l])=>`<button class="tab ${S.ver===v?'on':''}" data-a="ver" data-ver="${v}">${l}<b>${mine.filter(g=>!v||g.vs.some(m=>m.v===v)).length}</b></button>`).join('')}</div><div class="list">${list.map(g=>card(g,S.ver)).join('')}${ex.map(e=>`<div class="mi">${pics(e.imgs,e.n)}<div class="n">${esc(e.n)}</div><p class="nt">Ảnh này chưa xác định được thuộc mod nào, cần bạn xác nhận.</p></div>`).join('')}</div>${list.length||ex.length?'':'<div class="empty">Chưa có mod cho phiên bản này.</div>'}`;
  }
 }else{
  h=`<div class="top"><button class="btn" data-a="go" data-v="home">← Quay lại</button><h2>Mod súng</h2></div><p class="hint" style="text-align:left">Chọn súng để xem ảnh và thông tin mod</p><div class="gl">${gg.map(g=>{const id=g.vs[0].id;return `<button class="gb ${S.g===id?'sel':''}" data-a="pg" data-id="${id}"><span><b>${esc(g.n)}</b><br><small>${VL(g.vs[0].v)} · ${hs(g.vs[0].s)}</small></span><span>${S.g===id?'✓':'›'}</span></button>`}).join('')}</div>`;
  const g=gg.find(x=>x.vs[0].id===S.g);if(g)h+=`<div class="list" style="grid-template-columns:1fr;margin-top:14px">${card(g,'')}</div>`;
 }
 const m=$('#main');m.style.animation='none';m.offsetHeight;m.style.animation='';m.innerHTML=h;
}
document.addEventListener('click',e=>{
 const z=e.target.closest('[data-z]');if(z){$('#lb img').src=IMG[z.dataset.z];$('#lb').classList.add('on');return}
 if(e.target.closest('#lb')){$('#lb').classList.remove('on');return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='go'){S.v=b.dataset.v;S.c=null;S.ver='';S.g=null}
 else if(a==='pc'){S.c=S.c===b.dataset.c?null:b.dataset.c;S.ver=''}
 else if(a==='ver')S.ver=b.dataset.ver;
 else if(a==='pg')S.g=S.g===b.dataset.id?null:b.dataset.id;
 view();if(a==='go')window.scrollTo({top:0})
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
view();
</script></body></html>
